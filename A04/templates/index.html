<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask me anything</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url("{{ url_for('static', filename='wpp.jpg') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: 'Outfit', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px 0;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.25rem;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 10px 35px 0 rgba(0, 0, 0, 0.25);
            padding: 2.5rem;
            max-width: 600px;
            width: 100%;
        }
        .form-control {
            border-radius: 0.75rem;
            border: 1px solid rgba(0, 0, 0, 0.15);
            background: rgba(255, 255, 255, 0.95);
            resize: vertical;
        }
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        .btn-primary {
            border-radius: 0.75rem;
            padding: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.35);
        }
        .response-card {
            background: rgba(248, 249, 250, 0.95);
            border-radius: 0.75rem;
            border-left: 4px solid #0d6efd;
            text-align: left;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="glass-card text-center">
            <h1 class="display-5 fw-bold mb-3">Ask me anything</h1>
            <p class="text-muted mb-4">Enter your prompt below to generate a response.</p>
            <form method="POST">
                <div class="mb-3">
                    <textarea name="prompt" rows="4" class="form-control" placeholder="Enter your prompt..." required></textarea>
                </div>
                <div class="d-grid">
                    <input type="submit" value="Submit" class="btn btn-primary">
                </div>
            </form>
            
            {% if result %}
                <div class="mt-4 pt-3 border-top">
                    <h5 class="fw-semibold text-start mb-2">Response:</h5>
                    <div class="response-card p-3 shadow-sm">{{ result }}</div>
                </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
