<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask me anything</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="container d-flex justify-content-center">
        <div class="glass-card text-center">
            <h1 class="display-5 fw-bold mb-3">Generate an exhibition of your chosen object</h1>
            <p class="text-muted mb-4">Describe an object and get it exhibited with their label </p>
            <form method="POST">
                <div class="mb-3">
                    <textarea name="prompt" rows="4" class="form-control" placeholder="Describe an object"
                        required></textarea>
                </div>
                <div class="d-grid">
                    <input type="submit" value="Submit" class="btn btn-primary">
                </div>
            </form>

            {% if result %}
            <div class="mt-4 pt-3 border-top">
                <h5 class="fw-semibold text-start mb-2">Response:</h5>
                <div class="response-card p-3 shadow-sm">{{ result }}</div>
            </div>
            {% endif %}
        </div>
    </div>
</body>

</html>
